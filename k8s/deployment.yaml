apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsescale
  labels:
    app.kubernetes.io/name: pulsescale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsescale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsescale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/tabish3008/pulsescale:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PULSE_FORECAST_HORIZON_MINUTES
              value: "15"
            - name: PULSE_MAX_INTERVAL_RATIO
              value: "0.90"
            - name: PULSE_DEFAULT_CAPACITY
              value: "40"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
